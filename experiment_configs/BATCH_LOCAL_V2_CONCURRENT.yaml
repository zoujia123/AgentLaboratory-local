material-root: "D:/work/HUST/MASLab_v2"
output-root: "research_runs_glmv5"
max-concurrent-queries: 1
max-llm-http-attempts-per-query: 100
code_execution_timeout_seconds: 2000  # 单次代码执行上限（秒），用于数据准备、主实验和补充实验
console-log: false
compile-latex: false

seeds:
  strategy: "fixed"
  python: 2001
  numpy: 3001
  sklearn: 4001
  pytorch: 5001
  pytorch-deterministic: true


llm_sampling:
  temperature: 0.1
  top_p: 1
  max_tokens: 8192

collaboration_rounds:
  plan_max_rounds: 8
  data_preparation_max_rounds: 12
  interpretation_max_phd_reviews: 8

paper_writing:
  # sections 的排列顺序就是最终论文中的章节顺序。
  # word_target 是提示词中的目标单词数，max_chars 是工具参数中的最大字符数。
  sections:
    - name: Abstract
      word_target: 250
      max_chars: 2500
    - name: Introduction
      word_target: 600
      max_chars: 6500
    - name: Background
      word_target: 450
      max_chars: 5500
    - name: Related Work
      word_target: 500
      max_chars: 5500
    - name: Methods
      word_target: 700
      max_chars: 7000
    - name: Experimental Setup
      word_target: 650
      max_chars: 6500
    - name: Results
      word_target: 600
      max_chars: 6500
    - name: Discussion
      word_target: 650
      max_chars: 6500

  # 模型实际生成正文的顺序；必须包含上面所有章节且各出现一次。
  generation_order:
    - Introduction
    - Background
    - Related Work
    - Methods
    - Experimental Setup
    - Results
    - Discussion
    - Abstract

queries:

  - query-id: query_013
    recording-id: latest






